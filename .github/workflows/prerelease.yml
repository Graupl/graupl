name: Release

on
  push:
    # Push events to match v*.*.*-alpha.*, v*.*.*-beta.*, and v*.*.*-rc.* where * is a number.
      - 'v[0-9]+.[0-9]+.[0-9]+-[alpha|beta|rc].[0-9]+'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    # Prevent this action from running on forks.
    if: github.repository == 'graupl/graupl'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install modules
        run: npm install

      # Get the version from the package.json
      - name: Get version
        id: get_version
        run: |
          export VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Get the prerelease type from the package.json, e.g., 'alpha', 'beta', or 'rc'.
      - name: Get prerelease type
        id: get_prerelease_type
        run: |
          export PRERELEASE_TYPE=$(node -p "require('./package.json').version.split('-')[1].split('.')[0]")
          echo "PRERELEASE_TYPE=$PRERELEASE_TYPE" >> $GITHUB_ENV

      - name: Publish to npm
        if: github.tag
        run: npm publish --access public --tag ${{ env.PRERELEASE_TYPE }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          name: ${{ env.VERSION }}
          prerelease: true
